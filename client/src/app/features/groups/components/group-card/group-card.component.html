<article class="rounded-xl border border-base-300 bg-base-100 p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h2 class="text-lg font-semibold">{{ group().name }}</h2>
      <p class="mt-1 text-sm text-base-content/60">{{ group().members?.length ?? 0 }} members</p>
    </div>

    <span class="text-2xl">◎</span>
  </div>

  @if (group().description) {
    <p class="my-4 text-sm text-base-content/70">
      {{ group().description }}
    </p>
  }

  <a [routerLink]="['/groups', group().id]" class="btn btn-outline btn-primary btn-sm w-full">
    View group
  </a>
</article>
