<section class="space-y-5">
  <div>
    <h2 class="text-xl font-bold">Group Discussion</h2>
    <p class="mt-1 text-sm text-base-content/60">
      Share experiences, ask questions, and encourage one another.
    </p>
  </div>

  <div class="rounded-xl border border-base-300 bg-base-100 p-4">
    <app-journey-message-form (submitted)="createMessage.emit($event)" />
  </div>

  <app-journey-message-list
    [messages]="messages()"
    [currentUserId]="currentUserId()"
    (reply)="reply.emit($event)"
    (edit)="edit.emit($event)"
    (delete)="delete.emit($event)"
  />
</section>
