<div class="mt-3 space-y-3 border-l-2 border-base-300 pl-4">
  @for (reply of replies(); track reply.id) {
    <div>
      <p class="text-sm font-medium">
        {{ reply.author.name || 'Group member' }}
      </p>

      <p class="mt-1 text-sm">{{ reply.content }}</p>

      <p class="mt-1 text-xs text-base-content/50">
        {{ reply.createdAt | date: 'medium' }}
      </p>
    </div>
  }

  @if (showForm()) {
    <form class="space-y-2" (ngSubmit)="submit()">
      <textarea
        class="textarea textarea-bordered textarea-sm w-full"
        rows="2"
        [ngModel]="content()"
        (ngModelChange)="content.set($event)"
        name="reply"
        placeholder="Write a reply..."
      ></textarea>

      <div class="flex gap-2">
        <button class="btn btn-primary btn-xs" type="submit">Reply</button>
        <button class="btn btn-ghost btn-xs" type="button" (click)="showForm.set(false)">
          Cancel
        </button>
      </div>
    </form>
  } @else {
    <button class="btn btn-ghost btn-xs" (click)="showForm.set(true)">Reply</button>
  }
</div>
