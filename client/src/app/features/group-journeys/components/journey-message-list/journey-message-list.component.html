@if (messages().length) {
  <div class="space-y-4">
    @for (message of messages(); track message.id) {
      <app-journey-message-card
        [message]="message"
        [currentUserId]="currentUserId()"
        (reply)="reply.emit($event)"
        (edit)="edit.emit($event)"
        (delete)="delete.emit($event)"
      />
    }
  </div>
} @else {
  <div class="rounded-xl border border-dashed border-base-300 p-8 text-center">
    <h3 class="font-semibold">Start the conversation</h3>
    <p class="mt-2 text-sm text-base-content/60">Share a reflection or encourage another member.</p>
  </div>
}
