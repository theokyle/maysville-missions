<div class="hero min-h-screen" style="background-image: url(/fair.png)">
  <div class="hero-overlay"></div>
  @if (!registerMode()) {
    <div class="hero-content text-neutral-content text-center">
      <div class="max-w-md">
        <h1 class="mb-5 text-5xl font-bold">Welcome to Maysville Missions</h1>
        <p class="mb-5">
          Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi
          exercitationem quasi. In deleniti eaque aut repudiandae et a id nisi.
        </p>
        <button class="btn btn-primary" (click)="showRegister(true)">Get Started</button>
      </div>
    </div>
  } @else {
    <app-register (cancelRegister)="showRegister($event)"></app-register>
  }
</div>
