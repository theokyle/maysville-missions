<section class="mx-auto max-w-6xl px-4 py-8">
  <header class="mb-8">
    <p class="text-sm font-semibold uppercase tracking-wide text-primary">Explore</p>

    <h1 class="mt-2 text-3xl font-bold">Discover Journeys</h1>

    <p class="mt-3 max-w-2xl text-base-content/70">
      Find practical ways to grow, serve your community, and put your values into action.
    </p>
  </header>

  @if (loading()) {
    <div class="flex justify-center py-16">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  } @else if (error()) {
    <div class="alert alert-error">
      <span>{{ error() }}</span>
      <button class="btn btn-sm" (click)="loadJourneys()">Retry</button>
    </div>
  } @else {
    <app-journey-list [journeys]="journeys()" [enrolledJourneyIds]="enrolledJourneyIds()" />
  }
</section>
