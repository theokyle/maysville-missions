<div class="flex justify-around pt-10">
  @for (journey of journeys(); track journey.id) {
    <div class="card bg-base-100 w-96 shadow-sm">
      <figure class="px-10 pt-10">
        <img src="{{ journey.icon }}" alt="{{ journey.title }}" class="rounded-xl" />
      </figure>
      <div class="card-body items-center text-center">
        <h2 class="card-title">{{ journey.title }}</h2>
        <p>
          {{ journey.description }}
        </p>
        <div class="card-actions">
          <button class="btn btn-primary">Join the Journey</button>
        </div>
      </div>
    </div>
  }
</div>
