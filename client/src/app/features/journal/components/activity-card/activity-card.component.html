<article class="rounded-xl border border-base-300 bg-base-100 p-4">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="font-semibold">
        {{ activity().name || 'Activity' }}
      </h3>

      <p class="mt-1 text-xs text-base-content/50">
        {{ activity().createdAt | date: 'medium' }}
      </p>
    </div>

    <div class="dropdown dropdown-end">
      <button tabindex="0" class="btn btn-ghost btn-sm" aria-label="Activity options">...</button>

      <ul tabindex="0" class="menu dropdown-content z-10 w-36 rounded-box bg-base-100 p-2 shadow">
        <li><button (click)="edit.emit(activity())">Edit</button></li>
        <li><button class="text-error" (click)="delete.emit(activity())">Delete</button></li>
      </ul>
    </div>
  </div>

  @if (activity().note) {
    <p class="mt-3 whitespace-pre-line text-sm text-base-content/70">
      {{ activity().note }}
    </p>
  }
</article>
