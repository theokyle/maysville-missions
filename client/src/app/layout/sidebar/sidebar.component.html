<aside
  [class.sticky]="!isMobile()"
  [class.top-16]="!isMobile()"
  [class.h-[calc(100vh-4rem)]]="!isMobile()"
  [class.w-60]="!isMobile()"
  [class.shrink-0]="!isMobile()"
  [class.border-r]="!isMobile()"
  [class.fixed]="isMobile()"
  [class.inset-0]="isMobile()"
  [class.h-screen]="isMobile()"
  [class.w-full]="isMobile()"
  [class.z-[60]]="isMobile()"
  class="bg-base-100 p-4"
>
  @if (isMobile()) {
    <div class="flex justify-end mb-4">
      <button
        class="btn btn-ghost btn-square"
        aria-label="Close navigation menu"
        (click)="navigate.emit()"
      >
        <span class="text-3xl leading-none">&times;</span>
      </button>
    </div>
  }
  <nav class="h-full overflow-y-auto">
    <ul class="menu gap-1">
      <li>
        <a
          [routerLink]="dashboardLink.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="navigate.emit()"
        >
          {{ dashboardLink.label }}
        </a>
      </li>
    </ul>

    @for (group of navigationGroups; track group.label) {
      <div class="mt-6">
        <h2 class="px-4 pb-2 text-xs font-semibold uppercase tracking-wider text-base-content/50">
          {{ group.label }}
        </h2>

        <ul class="menu gap-1">
          @for (link of group.links; track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="navigate.emit()"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</aside>
