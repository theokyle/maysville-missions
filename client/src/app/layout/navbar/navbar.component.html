<header class="navbar fixed top-0 left-0 z-50 w-full border-b border-base-300 bg-base-100 px-4">
  <!-- Mobile hamburger -->
  <div class="flex-none md:hidden">
    <button
      class="btn btn-ghost btn-square"
      aria-label="Open navigation menu"
      (click)="sidebarOpen.set(true)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Logo -->
  <div class="flex-1">
    <a routerLink="/dashboard" class="text-xl font-bold text-primary"> Maysville Missions </a>
  </div>

  <!-- Account dropdown -->
  <div class="flex-none">
    @if (user(); as currentUser) {
      <div class="dropdown dropdown-end">
        <button tabindex="0" class="btn btn-ghost">
          {{ currentUser.name || currentUser.email }}
          <span class="ml-1">▾</span>
        </button>

        <ul
          tabindex="0"
          class="menu dropdown-content z-50 mt-3 w-48 rounded-box bg-base-100 p-2 shadow"
        >
          <li>
            <a routerLink="/profile">Profile</a>
          </li>
          <li>
            <button (click)="logout()">Sign out</button>
          </li>
        </ul>
      </div>
    }
  </div>
</header>

<!-- Mobile sidebar overlay -->
@if (sidebarOpen()) {
  <div class="fixed inset-0 z-[60] md:hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50" (click)="sidebarOpen.set(false)"></div>

    <!-- Full-screen sidebar -->
    <div class="absolute inset-0 overflow-y-auto bg-base-100">
      <button
        class="btn btn-ghost btn-square absolute right-4 top-4 z-10"
        aria-label="Close navigation menu"
        (click)="sidebarOpen.set(false)"
      >
        <span class="text-2xl">&times;</span>
      </button>

      <app-sidebar [isMobile]="true" (navigate)="sidebarOpen.set(false)" />
    </div>
  </div>
}
