<div class="navbar bg-base-100 shadow-sm flex justify-between">
  <div class="flex gap-3">
    <div class="flex items-center">
      <img src="./mmlogo.png" class="w-15" />
      <a class="btn btn-ghost text-xl" routerLink="/">Maysville Missions </a>
    </div>
    @if (currentUser()) {
      <div class="flex gap-3 uppercase text-lg items-center">
        <p class="mr-5">|</p>
        <a routerLink="/dashboard">Dashboard</a>
        <a routerLink="/journeys">Journeys</a>
        <a routerLink="/journal">Journal</a>
      </div>
    }
  </div>
  <div class="flex-none">
    @if (currentUser(); as user) {
      <!-- Logged-in User -->
      <div class="dropdown dropdown-end">
        <div
          tabindex="0"
          role="button"
          class="btn btn-ghost rounded-full gap-2"
          aria-label="Open user menu"
        >
          <div class="avatar placeholder">
            <div class="w-10 rounded-full bg-primary text-primary-content">
              <span class="flex justify-center text-3xl font-bold">
                {{ userInitials() }}
              </span>
            </div>
          </div>

          <span class="hidden sm:inline font-medium">
            {{ user.name || user.email }}
          </span>
        </div>

        <ul
          tabindex="-1"
          class="menu menu-sm dropdown-content bg-base-100 rounded-box z-10 mt-3 w-60 p-2 shadow-lg border border-base-300"
        >
          <!-- User Information -->
          <li class="menu-title">
            <span>{{ user.name || 'Welcome!' }}</span>
          </li>

          <li class="disabled">
            <a class="text-xs">{{ user.email }}</a>
          </li>

          <div class="divider my-1"></div>

          <!-- Navigation Links -->
          <li>
            <a routerLink="/profile"> Profile </a>
          </li>

          <li>
            <a routerLink="/settings"> Settings </a>
          </li>

          <div class="divider my-1"></div>

          <li>
            <button type="button" (click)="logout()">Sign Out</button>
          </li>
        </ul>
      </div>
    } @else {
      <!-- Logged-out User -->
      <div class="dropdown dropdown-end">
        <div
          tabindex="0"
          role="button"
          class="btn bg-gray-500 btn-ghost btn-circle text-white"
          aria-label="Open user menu"
        >
          <fa-icon [icon]="faUser" class="text-xl" />
        </div>

        <ul
          tabindex="-1"
          class="menu menu-sm dropdown-content bg-base-100 rounded-box z-10 mt-3 w-60 p-2 shadow-lg border border-base-300"
        >
          <!-- Navigation Links -->
          <li>
            <a routerLink="/" [queryParams]="{ form: 'signin' }">Sign In</a>
          </li>

          <li>
            <a routerLink="/" [queryParams]="{ form: 'register' }">Register</a>
          </li>
        </ul>
      </div>
    }
  </div>
</div>
