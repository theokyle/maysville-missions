@if (open()) {
  <div class="modal modal-open">
    <div class="modal-box">
      <h3 class="text-lg font-bold">{{ title() }}</h3>
      <p class="py-4 text-base-content/70">{{ message() }}</p>

      <div class="modal-action">
        <button class="btn btn-ghost" (click)="cancelled.emit()">Cancel</button>

        <button class="btn btn-error" (click)="confirmed.emit()">
          {{ confirmLabel() }}
        </button>
      </div>
    </div>

    <button class="modal-backdrop" aria-label="Close dialog" (click)="cancelled.emit()"></button>
  </div>
}
