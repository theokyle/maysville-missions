<div class="hero min-h-screen" style="background-image: url(/fair.png)">
  <div class="hero-overlay"></div>

  @if (!registerMode() && !signInMode()) {
    <div class="hero-content text-neutral-content text-center">
      <div class="max-w-md">
        <h1 class="mb-5 text-5xl font-bold">Welcome to Maysville Missions</h1>

        <p class="mb-5">
          Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi
          exercitationem quasi. In deleniti eaque aut repudiandae et a id nisi.
        </p>

        <div class="flex flex-wrap justify-center gap-3">
          <button class="btn btn-primary" (click)="showRegister(true)">Get Started</button>

          <button class="btn btn-secondary" (click)="showSignIn(true)">Sign In</button>
        </div>
      </div>
    </div>
  } @else {
    <div class="w-full max-w-3xl px-4">
      @if (registerMode()) {
        <app-register class="block w-full" (cancelRegister)="showRegister($event)" />
      } @else {
        <app-sign-in
          class="block w-full"
          (cancelSignIn)="showSignIn($event)"
          (registerRequested)="showRegister(true)"
        />
      }
    </div>
  }
</div>
